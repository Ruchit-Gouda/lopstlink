name: Keep backend awake

# Render's free plan puts a service to sleep after 15 minutes without traffic.
# A request every 10 minutes keeps the API warm so visitors do not wait for a
# cold start. Scheduled workflows can be delayed under load, so this reduces
# cold starts rather than guaranteeing zero delay.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://lostlink-api-zxg7.onrender.com/health)
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "Health check did not return 200"
          exit 1
